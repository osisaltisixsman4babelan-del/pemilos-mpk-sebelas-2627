<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEMILOS & MPK KELAS 11 - SMAN 4 Babelan 2026</title>
<style>
:root{--blue:#0051ff;}
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('bg_pemilos.jpeg') no-repeat center center fixed;background-size:cover;position:relative;}
header{text-align:center;padding:28px;color:#fff}
header h1{margin:0;font-size:26px} header p{opacity:.8}
.container{max-width:1100px;margin:auto;padding:0 16px 50px}
.section-title{color:#fff;font-size:20px;font-weight:800;margin:30px 0 12px;background:rgba(255,255,255,.1);padding:10px 16px;border-radius:12px;border-left:4px solid var(--blue)}
.paslon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.paslon-grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;border:3px solid transparent}
.card:hover{transform:translateY(-4px)} .card.active{border-color:var(--blue);box-shadow:0 0 0 4px #dbeafe}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card .info{padding:12px;text-align:center}.info h3{margin:0 0 4px;font-size:16px}
.vote-card{background:#fff;border-radius:20px;padding:22px;margin-top:26px}
label{font-weight:700;margin:12px 0 6px;display:block}
select,textarea,input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;font-size:15px}
input[readonly]{background:#f8fafc;font-weight:600;color:#1e293b}
button{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;padding:15px;width:100%;border-radius:12px;font-weight:800;font-size:18px;margin-top:18px;cursor:pointer;transition:.2s}
button:disabled{background:#94a3b8;cursor:not-allowed}
#status{text-align:center;margin-top:12px;font-weight:800;font-size:16px}
.success{color:#16a34a}.error{color:#dc2626}
</style>
</head>
<body>
<header>
  <h1>🗳️ PEMILOS SMAN 4 BABELAN 2026</h1>
  <p>OSIS & MPK - ALTISIX | AVERIONS (KHUSUS KELAS 11)</p>
</header>
<div class="container">
  <div id="loading" style="color:#fff;text-align:center;padding:40px;font-size:18px;">Loading data kelas 11... ⏳</div>
  <div id="main" style="display:none">
    <div class="section-title">🔵 PILIH KETUA OSIS - 3 PASLON</div>
    <div class="paslon-grid" id="gridOSIS"></div>
    
    <div class="section-title">🟢 PILIH KETUA MPK - 3 PASLON</div>
    <div class="paslon-grid" id="gridMPK"></div>
    
    <div class="vote-card">
      <label for="kelompok">1. Kelas</label>
      <select id="kelompok"></select>
      
      <label for="nama">2. Nama Kamu</label>
      <select id="nama"></select>
      
      <label for="pilOSIS">3. Pilihan OSIS</label>
      <input id="pilOSIS" readonly placeholder="Klik foto OSIS di atas">
      
      <label for="pilMPK">4. Pilihan MPK</label>
      <input id="pilMPK" readonly placeholder="Klik foto MPK di atas">
      
      <label for="isi">5. Harapan</label>
      <textarea id="isi" rows="2" placeholder="Tulis harapanmu untuk OSIS & MPK..."></textarea>
      
      <button onclick="kirim()" id="btn">KIRIM VOTE OSIS & MPK 🚀</button>
      <div id="status"></div>
    </div>
  </div>
</div>

<script>
// GANTI URL DI BAWAH INI DENGAN URL WEB APP BARU HASIL DEPLOY APPS SCRIPT KAMU
const API = "https://script.google.com/macros/s/AKfycbxyd3BU6HSfGVvqF86-rzXh8mugD26y5nHAd8Nidp_gBXedxMGIJKfaraTnOnO-5UETng/exec";
const NAMA_WEB = "WEB KELAS 11";

const CONFIG = {
  OSIS: [
    { id:"PASLON 1 OSIS", nama:"Chaesar Wira Pamungkas & Agreat Paulin Daniel", foto:"PASLON 01.jpeg" },
    { id:"PASLON 2 OSIS", nama:"Aliana Anggela Komba & Rasyha Al-Farizzy A.", foto:"PASLON 02.jpeg" },
    { id:"PASLON 3 OSIS", nama:"Dani Akmal Alfarizi & Athifa Gita Savitri", foto:"PASLON 03.jpeg" }
  ],
  MPK: [
    { id:"PASLON 1 MPK", nama:"Lili Mahidra Satya Putra & Anggita Fitriyani", foto:"PASLON 01 MPK.JPG" },
    { id:"PASLON 2 MPK", nama:"Frida Sarah Razak & Amanda Tatia Salsabila", foto:"PASLON 02 MPK.JPG" },
    { id:"PASLON 3 MPK", nama:"Fadli Suryadinigrat & Citra Insan Camelia", foto:"PASLON O3 MPK.JPG" } // Catatan: cek apakah nama file pakai huruf 'O' (PASLON O3) atau angka '0' (PASLON 03)
  ]
};

let DATA = {};
let SUDAH_VOTE = [];

function renderPaslon(){
  const gO = document.getElementById('gridOSIS'), gM = document.getElementById('gridMPK');
  gO.innerHTML = ''; gM.innerHTML = '';
  CONFIG.OSIS.forEach(p => {
    gO.innerHTML += `<div class="card" id="c-${p.id}" onclick="pilih('OSIS','${p.id}')"><img src="${p.foto}" alt="${p.id}"><div class="info"><h3>${p.id}</h3><small>${p.nama}</small></div></div>`;
  });
  CONFIG.MPK.forEach(p => {
    gM.innerHTML += `<div class="card" id="c-${p.id}" onclick="pilih('MPK','${p.id}')"><img src="${p.foto}" alt="${p.id}"><div class="info"><h3>${p.id}</h3><small>${p.nama}</small></div></div>`;
  });
}

function pilih(tipe, id){
  if(tipe === 'OSIS'){
    document.getElementById('pilOSIS').value = id;
    CONFIG.OSIS.forEach(p => document.getElementById('c-'+p.id).classList.remove('active'));
  } else {
    document.getElementById('pilMPK').value = id;
    CONFIG.MPK.forEach(p => document.getElementById('c-'+p.id).classList.remove('active'));
  }
  document.getElementById('c-'+id).classList.add('active');
}

async function load(){
  try{
    const r = await fetch(API);
    const res = await r.json();
    DATA = res.pemilih || {}; 
    
    // Sinkron langsung dengan data terbaru dari Google Sheets
    if (res.sudah && Array.isArray(res.sudah)) {
      SUDAH_VOTE = res.sudah.map(n => n.trim());
    }

    const selK = document.getElementById('kelompok'); 
    selK.innerHTML = '<option value="">-- Pilih Kelas 11 --</option>';
    
    // Filter hanya kelas yang berawalan 'XI.' (contoh: XI.A, XI.B, dst)
    const kelas11 = Object.keys(DATA).filter(k => k.toUpperCase().startsWith('XI.')).sort();
    
    if(kelas11.length === 0){
      selK.innerHTML = '<option value="">Data kelas XI belum tersedia di Sheets</option>';
    } else {
      kelas11.forEach(k => selK.innerHTML += `<option value="${k}">${k}</option>`);
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    selK.onchange = upd; 
    renderPaslon(); 
    upd();
  }catch(e){
    document.getElementById('loading').innerHTML = '❌ Gagal memuat data. Pastikan URL API benar & sudah di-deploy "Anyone".<br><small>Detail: '+e+'</small>';
  }
}

function upd(){
  const k = document.getElementById('kelompok').value, sN = document.getElementById('nama');
  sN.innerHTML = '<option value="">-- Pilih Nama --</option>';
  if(k && DATA[k]) {
    DATA[k].sort().forEach(n => {
      const sudah = SUDAH_VOTE.includes(n.trim());
      if(sudah){
        sN.innerHTML += `<option value="${n}" disabled style="color:#dc2626;background:#fee2e2;font-style:italic;">❌ ${n} (Sudah Memilih)</option>`;
      }else{
        sN.innerHTML += `<option value="${n}">${n}</option>`;
      }
    });
  }
}

async function kirim(){
  const nama = document.getElementById('nama').value, 
        kelompok = document.getElementById('kelompok').value,
        pilOSIS = document.getElementById('pilOSIS').value, 
        pilMPK = document.getElementById('pilMPK').value,
        isi = document.getElementById('isi').value, 
        status = document.getElementById('status'), 
        btn = document.getElementById('btn');
  
  if(!kelompok || !nama || !pilOSIS || !pilMPK){
    status.innerHTML='<span class="error">⚠️ Lengkapi kelas, nama, pilihan OSIS, dan MPK!</span>';
    return;
  }
  if(SUDAH_VOTE.includes(nama.trim())){
    status.innerHTML='<span class="error">❌ Nama ini sudah menggunakan hak suaranya!</span>';
    return;
  }

  btn.disabled = true; 
  btn.innerText = 'Mengirim suara... ⏳';
  status.innerHTML = '';

  try{
    const pilihan = `OSIS:${pilOSIS} | MPK:${pilMPK}`;
    const response = await fetch(API, {
      method: 'POST',
      body: new URLSearchParams({ nama, kelompok, pilihan, isi, website: NAMA_WEB })
    });
    const result = await response.json();

    if(result.status === 'success'){
      SUDAH_VOTE.push(nama.trim());
      status.innerHTML = `<span class="success">✅ Suara ${nama} BERHASIL disimpan! Reset dalam 2 detik...</span>`;
      btn.innerText = 'TERKIRIM ✅';
      
      setTimeout(()=>{
        upd(); 
        document.getElementById('pilOSIS').value = ''; 
        document.getElementById('pilMPK').value = ''; 
        document.getElementById('isi').value = '';
        CONFIG.OSIS.forEach(p => document.getElementById('c-'+p.id).classList.remove('active'));
        CONFIG.MPK.forEach(p => document.getElementById('c-'+p.id).classList.remove('active'));
        status.innerHTML = ''; 
        btn.disabled = false; 
        btn.innerText = 'KIRIM VOTE OSIS & MPK 🚀';
        window.scrollTo({top:0,behavior:'smooth'});
      }, 2000);
    } else {
      status.innerHTML = `<span class="error">❌ Gagal: ${result.message}</span>`;
      btn.disabled = false;
      btn.innerText = 'KIRIM VOTE OSIS & MPK 🚀';
    }
  }catch(e){
    status.innerHTML = '<span class="error">❌ Terjadi kesalahan jaringan: '+e+'</span>';
    btn.disabled = false;
    btn.innerText = 'KIRIM VOTE OSIS & MPK 🚀';
  }
}

load();
</script>
</body>
</html>
